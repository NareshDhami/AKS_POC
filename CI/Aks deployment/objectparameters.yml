parameters: 
  tags: object
  vnetAddressPrefixes: object

steps:
- ${{ each item in parameters }}:
  - task: PowerShell@2
    inputs:
      targetType: 'inline'
      script: |
            $parameterValue = '${{ convertToJson(item.value) }}' | ConvertFrom-Json
            #vnetAddressPrefixes parameter requires need to be an array in vnet.bicep
            if ( "${{ item.key }}" -eq "vnetAddressPrefixes") {
               $parameterValueStr = ConvertTo-Json -Compress @($parameterValue)
            } else {
               $parameterValueStr =  $parameterValue | ConvertTo-Json -Compress
            }
            Write-Host "##vso[task.setvariable variable=parameters.${{ item.key }}.value]$parameterValueStr"
            Write-Host $parameterValueStr
    displayName: "Set Variable 'parameters.${{ item.key }}.value'"