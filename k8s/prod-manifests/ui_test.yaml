apiVersion: apps/v1
kind: Deployment
metadata:
    name: ui--env--
    namespace: ns-posthub--env--
spec:
    replicas: 1
    selector:
        matchLabels:
            app: ui-test
    template:
        metadata:
            labels:
                app: ui--env--
        spec:
            containers:
            - name: ui--env--
                image: __ImageTag__
                resources:
                    requests:
                        cpu: 250m
                        memory: 350Mi
                    limits:
                        cpu: 1100m
                        memory: 900Mi
                ports:
                - containerPort: 3000

---
kind: Service
apiVersion: v1
metadata:
    name: ui-service--env--
    namspace: ns-posthub--env--
spec:
    selector:
        app: ui--env--
    ports:
      name: ui--env--
      port: 3000
      targetPort: 3000
      protocol:  TCP
    type: ClusterIP