apiVersion : apps/v1
kind: Deployment
metadata:
  name: your-image-name
spec:
  replicas: 1
  selector:
    matchLabels:
      app: your-image-name
  template:
    metadata:
      labels:
        app: your-image-name
    spec:
      containers:
        - name: your-image-name
          image: your-acr-name.azurecr.io/your-image-name
          ports:
          - containerPort: 3000